name = "mesay-api"
main = "src/index.js"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

[vars]
CORS_ORIGIN = "http://localhost:5173"
SUPABASE_STORAGE_BUCKET = "uploads"

# Secrets — set these, do NOT put them in this file:
